[package]
name = "klarity-exhibit-20-fake-door-integration"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fake door FHIR bundle checks"
publish = false

[lib]
name = "fake_door"
path = "src/lib.rs"

[[bin]]
name = "validate-fake-door"
path = "src/bin/validate_fake_door.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
